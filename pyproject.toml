[project]
name = "bank-agent"
version = "1.0.0"
description = "Agente Bancário Restrito — projeto final da formação de especialista em IA (Santander/Alura)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
