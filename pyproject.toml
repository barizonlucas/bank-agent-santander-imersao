[project]
name = "bank-agent"
version = "1.0.0"
description = "Agente Bancário Restrito — projeto final da formação de especialista em IA (Santander/Alura)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501"]  # long Portuguese message/regex lines are formatted by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
